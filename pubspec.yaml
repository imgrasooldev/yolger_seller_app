  flutter_image_compress: ^2.4.0
  country_picker: ^2.0.27
  connectivity_plus: ^7.0.0
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.5.3
  fl_chart: ^1.1.1
  video_compress: ^3.1.4
  url_launcher: ^6.3.2
  sleek_circular_slider: ^2.1.0
  pretty_dio_logger: ^1.4.0
  intl_phone_field: ^3.2.0
  flutter_widget_from_html: ^0.15.2
  audioplayers: ^6.1.0
  flutter_inappwebview: ^6.1.5
  upgrader: ^12.5.0
  flutter_launcher_icons: ^0.14.4


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_launcher_logo/launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/app_launcher_logo/launcher_icon.png"

flutter:

  uses-material-design: true
  generate: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/png/
    - assets/images/payment-logos/
    - assets/images/svg/
    - assets/audio/
    - assets/
    - assets/images/
    - assets/images/app_launcher_logo/

  # An image asset can refer to one or more_page resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

