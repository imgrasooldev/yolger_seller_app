  flutter_tabler_icons: ^1.43.0
  remixicon: ^1.4.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  flutter_quill: ^11.5.1
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  intl: ^0.20.2
  dio: ^5.9.0
  curl_logger_dio_interceptor: ^1.0.1
  firebase_messaging: ^16.1.1
  change_app_package_name: ^1.5.0
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  flutter_local_notifications: ^19.5.0
  app_settings: ^7.0.0
  path_provider: ^2.1.5
  cached_network_image: ^3.4.1
